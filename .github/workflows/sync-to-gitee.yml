name: Sync to Gitee

on:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Push to Gitee
        uses: wearerequired/git-mirror-action@v1
        env:
          GITEE_RSA_KEY: ${{ secrets.GITEE_RSA_KEY }}
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
        with:
          destination-repo: "harrycjh/harrycjh-projects"
